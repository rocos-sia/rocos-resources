# Techsoft TB6 R3 六轴硬件配置；id 为 ENI 从站的零基拓扑序号（物理地址 1001–1006）。
# 第三轴位置限位经现场确认为 ±150°。
# 六轴运动限位：vel=1.0 rad/s、acc=10.0 rad/s²、jerk=100.0 rad/s³。
# 其余限位保留原 robot.urdf 的名义值。
# ENI 不提供减速比、编码器零点和力矩标定。
# 换算依据：docs/TB6-R3六轴关节参数与码值换算.xlsx；J1–J3 n=101，J4–J6 n=100。
# pos_per_unit = 2^17/(2π)，低速端位置不再乘减速比。
# vel_per_unit = (20000×4)×n/(0.1×2π)，高速端速度每码为 0.1 count/s。
# torque_per_unit = 1000/(额定电流×力矩常数×n)，按用户确认的额定力矩千分比折算低速端，不计效率。
# 下列速度、力矩系数已包含减速比，ratio 保持 1.0。
# eni6.xml 通过 SDO 0x6060=8 初始化 CSP，启用 RxPDO 0x1600 / TxPDO 0x1a00。
# 模式、目标位置/速度/力矩均映射；PDO 名称取 ProcessImage 最后一段，保留 [序号] 后缀。
# 未提供独立负载力矩/副编码器；对应输入留空，GetJointLoadTorque 返回 0。
hardware:
  # joint_1 — ENI Slave_1001
  - id: 0
    type: driver
    joint_name: joint_1
    torque_source: load_torque
    limit:
      lower: -2.0
      upper: 2.0
      vel: 1.0
      acc: 10.0
      jerk: 100.0
      effort: 30.0
    transform:
      ratio: 1.0
      offset_pos_cnt: 0
      pos_per_unit: 20860.756700940907  # 低速端位置 count/rad
      vel_per_unit: 12859719.401825  # 高速端速度码/(rad/s)，n=101
      torque_per_unit: 11.001100110011  # 低速端力矩码/(N·m)，1000/(6×0.15×101)
      load_torque_per_unit: 1.0  # 负载力矩码值/单位力矩，两种 torque_source 共用，默认 1.0
      user_unit_name: rad
    inputs:
      status_word: "Status word[0]"
      position_actual_value: "Actual motor position[1]"
      velocity_actual_value: "Actual motor velocity[2]"
      torque_actual_value: "Torque actual value[3]"
      load_torque_value: ''
      secondary_position_value: ''
    outputs:
      control_word: "Control word[2]"
      mode_of_operation: "Modes of operation[0]"
      target_position: "Profile target position[3]"
      target_velocity: "Target velocity[4]"
      target_torque: "Target Torque[1]"

